<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شمارنده اسکناس پیشرفته (آفلاین)</title>
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="شمارنده اسکناس">
    <meta name="apple-mobile-web-app-title" content="شمارنده اسکناس">
    <meta name="msapplication-starturl" content="/">
    <meta name="theme-color" content="#4f46e5">

    <style>
        /* --- General Styles & Tailwind CSS Replacements --- */
        :root {
            --color-gray-100: #f3f4f6;
            --color-gray-200: #e5e7eb;
            --color-gray-300: #d1d5db;
            --color-gray-500: #6b7280;
            --color-gray-600: #4b5563;
            --color-gray-800: #1f2937;
            --color-indigo-600: #4f46e5;
            --color-emerald-50: #ecfdf5;
            --color-emerald-600: #059669;
            --color-red-100: #fee2e2;
            --color-red-500: #ef4444;
            --color-red-600: #dc2626;
            --color-red-700: #b91c1c;
            --color-green-100: #d1fae5;
            --color-green-700: #047857;
            --color-blue-100: #dbeafe;
            --color-blue-700: #1d4ed8;
            --color-yellow-500: #f59e0b;
            --color-teal-500: #14b8a6;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { overflow-x: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 1rem;
        }

        .main-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 1.5rem;
        }
        .denomination-row {
            margin-bottom: 0.75rem; /* Reduced */
            padding-bottom: 0.75rem; /* Reduced */
            border-bottom: 1px solid var(--color-gray-200);
        }
        .denomination-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .denomination-label { font-weight: 700; font-size: 1.125rem; color: var(--color-gray-800); margin-bottom: 0.5rem; } /* Reduced */
        .inputs-container { display: flex; gap: 1rem; align-items: center; }
        .input-group { flex: 1; position: relative; }
        .input-label { position: absolute; top: -0.65rem; right: 0.75rem; background-color: white; padding: 0 0.25rem; font-size: 0.75rem; color: var(--color-gray-500); }
        .input-wrapper { display: flex; align-items: center; border: 1px solid var(--color-gray-300); border-radius: 0.5rem; overflow: hidden; }
        .input-wrapper:focus-within { border-color: var(--color-indigo-600); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        .input-field { width: 100%; padding: 0.6rem; text-align: center; font-size: 1.125rem; border: none; outline: none; -moz-appearance: textfield; } /* Reduced */
        .input-field::-webkit-outer-spin-button, .input-field::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .stepper-button { background-color: var(--color-gray-100); border: none; color: var(--color-gray-600); font-size: 1.2rem; font-weight: bold; cursor: pointer; padding: 0.4rem 0.8rem; transition: background-color 0.2s; user-select: none; } /* Reduced */
        .subtotal-display { text-align: center; margin-top: 0.5rem; font-size: 1.125rem; font-weight: 700; color: var(--color-indigo-600); height: 1.75rem; } /* Reduced */
        .total-display { font-size: 2rem; font-weight: 700; color: var(--color-emerald-600); letter-spacing: 1px; background-color: var(--color-emerald-50); padding: 1rem; border-radius: 0.75rem; }
        .summary-section .card { padding: 1.5rem; }
        .comparison-section, .actions-section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-gray-200); }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .full-width-button { grid-column: 1 / -1; }
        .difference-display { font-size: 1.25rem; font-weight: 700; padding: 0.75rem; border-radius: 0.75rem; margin-top: 0.75rem; transition: all 0.3s ease; }
        .action-button { width: 100%; color: white; font-weight: 700; padding: 0.75rem 1rem; border-radius: 0.75rem; border: none; cursor: pointer; transition: all 0.3s ease-in-out; }
        .action-button:hover { transform: translateY(-2px); }
        .reset-button { background-color: var(--color-red-500); }
        .reset-button:hover { background-color: var(--color-red-600); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .save-button { background-color: var(--color-blue-700); }
        .save-button:hover { background-color: #1e40af; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); }
        .history-button { background-color: var(--color-gray-600); }
        .history-button:hover { background-color: var(--color-gray-800); box-shadow: 0 4px 12px rgba(75, 85, 99, 0.3); }
        .print-button { background-color: var(--color-teal-500); }
        .print-button:hover { background-color: #0d9488; box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3); }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
        .modal-content { background-color: white; padding: 1.5rem; border-radius: 1rem; width: 100%; max-width: 40rem; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-gray-200); padding-bottom: 1rem; margin-bottom: 1rem; }
        .modal-title { font-size: 1.5rem; font-weight: 700; color: var(--color-gray-800); }
        .modal-close-button { background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--color-gray-500); }
        .modal-body { overflow-y: auto; flex-grow: 1; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { background-color: var(--color-gray-100); border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; }
        .history-item:last-child { margin-bottom: 0; }
        .history-title-bar { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--color-gray-300); padding-bottom: 0.5rem; margin-bottom: 0.5rem;}
        .history-name { font-size: 1.2rem; font-weight: 700; color: var(--color-gray-800); }
        .history-date { font-size: 0.8rem; font-weight: 600; color: var(--color-gray-600); }
        .history-details span { display: block; margin-bottom: 0.25rem; }
        .modal-footer { border-top: 1px solid var(--color-gray-200); padding-top: 1rem; margin-top: 1rem; }
        .clear-history-button { background-color: var(--color-yellow-500); }
        .clear-history-button:hover { background-color: #d97706; }
        .history-breakdown { margin-top: 0.75rem; border-top: 1px dashed var(--color-gray-300); padding-top: 0.75rem; }
        .history-breakdown summary { cursor: pointer; font-weight: 600; color: var(--color-indigo-600); outline: none; }
        .history-breakdown ul { list-style-type: none; padding-right: 1rem; margin-top: 0.5rem; font-size: 0.9rem; color: var(--color-gray-600); }
        .history-breakdown li { margin-bottom: 0.25rem; }
        
        /* Difference Display States */
        .status-neutral { color: var(--color-gray-500); background-color: var(--color-gray-100); }
        .status-shortage { color: var(--color-red-700); background-color: var(--color-red-100); }
        .status-surplus { color: var(--color-green-700); background-color: var(--color-green-100); }
        .status-equal { color: var(--color-blue-700); background-color: var(--color-blue-100); }

        /* --- Responsive & Desktop Optimizations --- */
        @media (min-width: 1024px) {
            body { display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; padding: 2rem; }
            .main-container { display: grid; grid-template-columns: 1fr 400px; gap: 2rem; max-width: 1300px; }
            .calculator-section { grid-column: 1 / 2; }
            .summary-section { grid-column: 2 / 3; position: sticky; top: 2rem; }
            
            #denominations-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem 1.5rem; /* Reduced */
            }
            .denomination-row {
                margin-bottom: 0;
                padding-bottom: 0.75rem; /* Reduced */
                border-bottom: 1px solid var(--color-gray-200);
            }
            .denomination-row:nth-last-child(-n+2) {
                 border-bottom: none;
            }

            .actions-grid { grid-template-columns: 1fr 1fr; }
            .full-width-button { grid-column: 1 / -1; }
        }

        @media (min-width: 1536px) {
             .main-container { max-width: 1600px; grid-template-columns: 1fr 420px; }
             #denominations-container { grid-template-columns: 1fr 1fr 1fr; }
             .denomination-row { border-bottom: 1px solid var(--color-gray-200) !important; }
             .denomination-row:nth-last-child(-n+3) {
                 border-bottom: none !important;
            }
        }


        /* --- Print Styles --- */
        @media print {
            body { background-color: white; padding: 0; }
            .main-container, .modal-overlay { display: none; }
            #print-area { display: block !important; }
            @page { size: A4; margin: 2cm; }
            #print-area h1 { font-size: 22pt; text-align: center; margin-bottom: 0.5cm; }
            #print-area .print-record-name { text-align: center; margin-top:0; margin-bottom: 1cm; font-size: 14pt; font-weight: normal; color: #333; }
            #print-area h2 { font-size: 16pt; margin-top: 1.5cm; border-bottom: 2px solid black; padding-bottom: 0.25cm; }
            #print-area table { width: 100%; border-collapse: collapse; margin-top: 0.5cm; font-size: 12pt; }
            #print-area th, #print-area td { border: 1px solid #ccc; padding: 0.3cm; text-align: right; }
            #print-area th { background-color: #f0f0f0; font-weight: bold; }
            #print-area .print-summary { margin-top: 1cm; font-size: 14pt; }
            #print-area .print-summary p { margin: 0.5cm 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="calculator-section card">
            <h1 style="font-size: 1.875rem; font-weight: 700; text-align: center; margin-bottom: 2rem;">شمارش اسکناس</h1>
            <div id="denominations-container"></div>
        </div>

        <div class="summary-section">
            <div class="card">
                <div style="text-align: center;">
                    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem;">مبلغ کل شمارش شده (ریال)</h2>
                    <div class="total-display">
                        <span id="total-amount">۰</span>
                    </div>
                </div>
                
                <div class="comparison-section text-center">
                    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem;">مقایسه با موجودی صندوق</h2>
                    <div class="input-group" style="margin-bottom: 0.75rem;">
                        <label class="input-label">موجودی صندوق (ریال)</label>
                        <input type="text" inputmode="numeric" id="cash-box-balance" class="input-field" placeholder="مبلغ را وارد کنید" oninput="handleBalanceInput(event)" style="border: 1px solid var(--color-gray-300); border-radius: 0.5rem;">
                    </div>
                    <div id="difference-display" class="difference-display status-neutral">
                        موجودی را وارد کنید
                    </div>
                </div>

                <div class="actions-section">
                    <div class="input-group" style="margin-bottom: 1rem;">
                        <label class="input-label">نام گزارش (اختیاری)</label>
                        <input type="text" id="record-name" class="input-field" placeholder="مثال: صندوق آخر وقت" style="border: 1px solid var(--color-gray-300); border-radius: 0.5rem;">
                    </div>
                    <div class="actions-grid">
                        <button onclick="saveResult()" class="action-button save-button">ذخیره نتیجه</button>
                        <button onclick="showHistory()" class="action-button history-button">مشاهده سوابق</button>
                        <button onclick="printReport()" class="action-button print-button full-width-button">چاپ گزارش</button>
                        <button onclick="resetCalculator()" class="action-button reset-button full-width-button">شروع مجدد</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay" onclick="hideHistory(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">سوابق شمارش</h2>
                <button class="modal-close-button" onclick="hideHistory({target: document.getElementById('history-modal')})">&times;</button>
            </div>
            <div class="modal-body">
                <ul id="history-list" class="history-list"></ul>
            </div>
            <div class="modal-footer">
                <button onclick="clearHistory()" class="action-button clear-history-button" style="width:100%">پاک کردن کل سوابق</button>
            </div>
        </div>
    </div>

    <!-- Print Area (Hidden by default) -->
    <div id="print-area" style="display: none;"></div>

    <script>
        const denominations = [
            { value: 1,       label: '۱' },
            { value: 10000,   label: '۱۰,۰۰۰' },
            { value: 20000,   label: '۲۰,۰۰۰' },
            { value: 50000,   label: '۵۰,۰۰۰' },
            { value: 100000,  label: '۱۰۰,۰۰۰' },
            { value: 500000,  label: '۵۰۰,۰۰۰' },
            { value: 1000000, label: '۱,۰۰۰,۰۰۰' },
            { value: 2000000, label: '۲,۰۰۰,۰۰۰' }
        ];

        const container = document.getElementById('denominations-container');

        denominations.forEach(denom => {
            const row = document.createElement('div');
            row.className = 'denomination-row';
            const headerText = `اسکناس ${denom.label} ریالی`;
            row.innerHTML = `
                <h3 class="denomination-label">${headerText}</h3>
                <div class="inputs-container">
                    <div class="input-group">
                        <label class="input-label">تکی</label>
                        <div class="input-wrapper">
                            <button class="stepper-button" onclick="changeValue('d${denom.value}', 1)">+</button>
                            <input type="text" inputmode="numeric" id="d${denom.value}" class="input-field" placeholder="تعداد" oninput="calculateTotal()">
                            <button class="stepper-button" onclick="changeValue('d${denom.value}', -1)">−</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">دسته ۱۰۰تایی</label>
                        <div class="input-wrapper">
                            <button class="stepper-button" onclick="changeValue('b${denom.value}', 1)">+</button>
                            <input type="text" inputmode="numeric" id="b${denom.value}" class="input-field" placeholder="تعداد" oninput="calculateTotal()">
                            <button class="stepper-button" onclick="changeValue('b${denom.value}', -1)">−</button>
                        </div>
                    </div>
                </div>
                <div class="subtotal-display" id="subtotal-${denom.value}">۰ ریال</div>
            `;
            container.appendChild(row);
        });

        function changeValue(inputId, amount) {
            const input = document.getElementById(inputId);
            let currentValue = getNumericValue(input.value);
            currentValue += amount;
            if (currentValue < 0) currentValue = 0;
            input.value = currentValue > 0 ? currentValue.toLocaleString('fa-IR') : '';
            input.dispatchEvent(new Event('input'));
        }

        function convertPersianToEnglish(str) {
            return String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        }

        function getNumericValue(formattedString) {
            const englishString = convertPersianToEnglish(String(formattedString));
            return parseInt(englishString.replace(/[^0-9]/g, ''), 10) || 0;
        }
        
        function handleBalanceInput(event) {
            const input = event.target;
            const numericValue = getNumericValue(input.value);
            input.value = numericValue > 0 ? numericValue.toLocaleString('fa-IR') : '';
            calculateTotal();
        }

        function calculateTotal() {
            let grandTotal = 0;
            denominations.forEach(denom => {
                const individualCount = getNumericValue(document.getElementById(`d${denom.value}`).value);
                const bundleCount = getNumericValue(document.getElementById(`b${denom.value}`).value);
                const totalCount = individualCount + (bundleCount * 100);
                const subtotal = totalCount * denom.value;
                grandTotal += subtotal;
                document.getElementById(`subtotal-${denom.value}`).textContent = `${subtotal.toLocaleString('fa-IR')} ریال`;
            });
            document.getElementById('total-amount').textContent = grandTotal.toLocaleString('fa-IR');
            
            const cashBoxInput = document.getElementById('cash-box-balance');
            const differenceDisplay = document.getElementById('difference-display');
            
            if (cashBoxInput.value === '') {
                differenceDisplay.textContent = 'موجودی را وارد کنید';
                differenceDisplay.className = 'difference-display status-neutral';
                return;
            }

            const boxBalance = getNumericValue(cashBoxInput.value);
            const difference = boxBalance - grandTotal;

            if (difference > 0) {
                differenceDisplay.textContent = `کسری: ${difference.toLocaleString('fa-IR')} ریال`;
                differenceDisplay.className = 'difference-display status-shortage';
            } else if (difference < 0) {
                differenceDisplay.textContent = `فزونی: ${Math.abs(difference).toLocaleString('fa-IR')} ریال`;
                differenceDisplay.className = 'difference-display status-surplus';
            } else {
                differenceDisplay.textContent = 'تراز';
                differenceDisplay.className = 'difference-display status-equal';
            }
        }

        function resetCalculator() {
            denominations.forEach(denom => {
                document.getElementById(`d${denom.value}`).value = '';
                document.getElementById(`b${denom.value}`).value = '';
            });
            document.getElementById('cash-box-balance').value = '';
            document.getElementById('record-name').value = '';
            calculateTotal();
        }

        // --- History Functions ---
        function saveResult() {
            const totalAmount = document.getElementById('total-amount').textContent;
            const boxBalance = document.getElementById('cash-box-balance').value || '۰';
            const differenceEl = document.getElementById('difference-display');
            const recordName = document.getElementById('record-name').value.trim() || 'بدون عنوان';
            
            if (totalAmount === '۰' && (boxBalance === '۰' || boxBalance === '')) {
                alert('مقداری برای ذخیره وجود ندارد.');
                return;
            }

            const breakdown = denominations.map(denom => ({
                label: denom.label,
                value: denom.value,
                individual: getNumericValue(document.getElementById(`d${denom.value}`).value),
                bundle: getNumericValue(document.getElementById(`b${denom.value}`).value),
            }));

            const record = {
                name: recordName,
                date: new Date().toISOString(),
                total: totalAmount,
                balance: boxBalance,
                differenceText: differenceEl.textContent,
                differenceClass: differenceEl.className,
                breakdown: breakdown
            };

            let history = JSON.parse(localStorage.getItem('cashCounterHistory')) || [];
            history.unshift(record);
            localStorage.setItem('cashCounterHistory', JSON.stringify(history));
            alert(`نتیجه با نام "${recordName}" ذخیره شد!`);
        }

        function showHistory() {
            renderHistory();
            document.getElementById('history-modal').style.display = 'flex';
        }

        function hideHistory(event) {
            if (event.target.id === 'history-modal' || event.target.classList.contains('modal-close-button')) {
                 document.getElementById('history-modal').style.display = 'none';
            }
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('cashCounterHistory')) || [];
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = '<p style="text-align:center; color: var(--color-gray-500);">سابقه‌ای برای نمایش وجود ندارد.</p>';
                return;
            }

            history.forEach(record => {
                const item = document.createElement('li');
                item.className = 'history-item';
                const formattedDate = new Date(record.date).toLocaleString('fa-IR', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                let breakdownHtml = '';
                if (record.breakdown && Array.isArray(record.breakdown)) {
                    const breakdownDetails = record.breakdown
                        .filter(b => b.individual > 0 || b.bundle > 0)
                        .map(b => {
                            const breakdownLabel = `اسکناس ${b.label} ریالی`;
                            return `<li>${breakdownLabel}: ${b.individual.toLocaleString('fa-IR')} تکی, ${b.bundle.toLocaleString('fa-IR')} دسته</li>`
                        })
                        .join('');
                    
                    if(breakdownDetails) {
                        breakdownHtml = `
                            <details class="history-breakdown">
                                <summary>مشاهده جزئیات شمارش</summary>
                                <ul>${breakdownDetails}</ul>
                            </details>
                        `;
                    }
                }

                item.innerHTML = `
                    <div class="history-title-bar">
                        <h4 class="history-name">${record.name}</h4>
                        <p class="history-date">${formattedDate}</p>
                    </div>
                    <div class="history-details">
                        <span>مبلغ شمارش شده: ${record.total} ریال</span>
                        <span>موجودی صندوق: ${record.balance} ریال</span>
                        <span class="${record.differenceClass}" style="padding: 0.25rem 0.5rem; border-radius: 0.5rem; text-align: center; margin-top: 0.5rem;">${record.differenceText}</span>
                    </div>
                    ${breakdownHtml}
                `;
                historyList.appendChild(item);
            });
        }

        function clearHistory() {
            if (confirm('آیا از پاک کردن کل سوابق مطمئن هستید؟')) {
                localStorage.removeItem('cashCounterHistory');
                renderHistory();
            }
        }

        // --- Print Function ---
        function printReport() {
            const printArea = document.getElementById('print-area');
            const totalAmount = document.getElementById('total-amount').textContent;
            const boxBalance = document.getElementById('cash-box-balance').value || '۰';
            const differenceText = document.getElementById('difference-display').textContent;
            const recordName = document.getElementById('record-name').value.trim();
            const now = new Date();
            const formattedDate = now.toLocaleString('fa-IR', { dateStyle: 'full', timeStyle: 'short' });

            let tableRows = '';
            denominations.forEach(denom => {
                const individualCount = getNumericValue(document.getElementById(`d${denom.value}`).value);
                const bundleCount = getNumericValue(document.getElementById(`b${denom.value}`).value);
                const totalCount = individualCount + (bundleCount * 100);
                const subtotal = totalCount * denom.value;

                if(totalCount > 0) {
                    tableRows += `
                        <tr>
                            <td>اسکناس ${denom.label} ریالی</td>
                            <td>${individualCount.toLocaleString('fa-IR')}</td>
                            <td>${bundleCount.toLocaleString('fa-IR')}</td>
                            <td>${subtotal.toLocaleString('fa-IR')} ریال</td>
                        </tr>
                    `;
                }
            });

            const reportHTML = `
                <h1>گزارش شمارش موجودی</h1>
                ${recordName ? `<h2 class="print-record-name">برای: ${recordName}</h2>` : ''}
                <p style="text-align: left; font-size: 11pt; color: #555;">تاریخ و ساعت: ${formattedDate}</p>
                
                <h2>جزئیات شمارش</h2>
                <table>
                    <thead>
                        <tr>
                            <th>نوع اسکناس</th>
                            <th>تعداد تکی</th>
                            <th>تعداد دسته</th>
                            <th>جمع (ریال)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <h2>خلاصه نتایج</h2>
                <div class="print-summary">
                    <p><strong>مبلغ کل شمارش شده:</strong> ${totalAmount} ریال</p>
                    <p><strong>موجودی اعلامی صندوق:</strong> ${boxBalance} ریال</p>
                    <p><strong>نتیجه نهایی:</strong> ${differenceText}</p>
                </div>
            `;

            printArea.innerHTML = reportHTML;
            window.print();
        }

        window.onload = () => {
            calculateTotal();
            // PWA Setup would go here if needed
        };
    </script>
</body>
</html>
